<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="30%" stop-color="#F5E28E" />
      <stop offset="60%" stop-color="#C9A227" />
      <stop offset="90%" stop-color="#9C7811" />
      <stop offset="100%" stop-color="#D8B744" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C76B" />
      <stop offset="50%" stop-color="#FFF5D1" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <!-- Deep Navy Background -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B33" />
      <stop offset="100%" stop-color="#050E1B" />
    </linearGradient>
    <!-- Marble Texture Pattern -->
    <linearGradient id="marbleVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132B4F" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0B1B33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1A3A68" stop-opacity="0.7" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left side) -->
  <g transform="translate(10, 10)">
    <!-- Outer Golden Octagon / Diamond Slab Frame -->
    <polygon points="50,2 92,20 100,50 92,80 50,98 8,80 0,50 8,20" fill="url(#navyGrad)" stroke="url(#goldLinear)" stroke-width="2.5" />
    
    <!-- Inner Marble Inlay with geometric cuts -->
    <polygon points="50,8 86,24 93,50 86,76 50,92 14,76 7,50 14,24" fill="url(#marbleVein)" stroke="url(#goldLight)" stroke-width="0.8" stroke-dasharray="3 1" />
    
    <!-- Stylized Marble Veins in Gold -->
    <path d="M 18,32 Q 35,45 42,30 T 78,40" fill="none" stroke="url(#goldLight)" stroke-width="0.6" opacity="0.4" />
    <path d="M 22,68 Q 45,55 58,72 T 84,60" fill="none" stroke="url(#goldLight)" stroke-width="0.5" opacity="0.35" />

    <!-- Central S Monogram & Diamond Icon -->
    <!-- Stylized 'S' crafted from natural stone facet geometry -->
    <path d="M 64,32 C 60,26 42,24 36,32 C 30,40 38,46 50,50 C 66,55 70,62 64,72 C 58,80 38,78 32,70" fill="none" stroke="url(#goldLinear)" stroke-width="4.5" stroke-linecap="round" filter="url(#subtleGlow)" />
    
    <!-- Luxury Diamond Accents -->
    <polygon points="50,15 54,20 50,25 46,20" fill="url(#goldLight)" />
    <polygon points="50,75 54,80 50,85 46,80" fill="url(#goldLight)" />
    <polygon points="20,50 24,54 20,58 16,54" fill="url(#goldLight)" opacity="0.8" />
    <polygon points="80,50 84,54 80,58 76,54" fill="url(#goldLight)" opacity="0.8" />
  </g>

  <!-- BRAND NAME & TYPOGRAPHY -->
  <g transform="translate(130, 20)">
    <!-- Primary Heading: SHARANYA -->
    <text x="0" y="46" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="36" font-weight="700" letter-spacing="4" fill="url(#goldLinear)" filter="url(#subtleGlow)">
      SHARANYA
    </text>

    <!-- Sub Heading: MARBLES -->
    <text x="248" y="46" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="36" font-weight="300" letter-spacing="4" fill="#FFFFFF">
      MARBLES
    </text>

    <!-- Golden Divider Line with Center Diamond -->
    <line x1="0" y1="62" x2="165" y2="62" stroke="url(#goldLinear)" stroke-width="1.2" opacity="0.7" />
    <polygon points="175,62 178,59 181,62 178,65" fill="url(#goldLight)" />
    <line x1="191" y1="62" x2="365" y2="62" stroke="url(#goldLinear)" stroke-width="1.2" opacity="0.7" />

    <!-- Tagline: QUALITY YOU SEE, SERVICE YOU TRUST -->
    <text x="2" y="78" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.2" fill="url(#goldLight)">
      QUALITY YOU SEE, SERVICE YOU TRUST
    </text>
  </g>
</svg>
