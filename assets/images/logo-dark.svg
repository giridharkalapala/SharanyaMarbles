      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="30%" stop-color="#E5C76B" />
      <stop offset="70%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#8F6E0B" />
    </linearGradient>
