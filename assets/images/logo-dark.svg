<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Logo Gold Gradient -->
    <linearGradient id="logoGoldD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB96C" />
      <stop offset="35%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#E8CF94" />
      <stop offset="100%" stop-color="#9A782F" />
    </linearGradient>

    <!-- Carrara White Tile Gradient -->
    <linearGradient id="carraraTileD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Marquina Black Tile Gradient -->
    <linearGradient id="marquinaTileD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Granite Grey Tile Gradient -->
    <linearGradient id="graniteTileD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- ================= EMBLEM (Left) ================= -->
  <g transform="translate(10, 8)">
    <!-- Golden Outer Arc -->
    <path d="M 70,12 A 65,65 0 1 0 125,105" fill="none" stroke="url(#logoGoldD)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- House Roof Contour & Window Grid -->
    <path d="M 68,36 L 102,18 L 136,36" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <!-- 4-Pane Window -->
    <g transform="translate(97, 36)" fill="url(#logoGoldD)">
      <rect x="0" y="0" width="4.5" height="4.5" rx="0.5" />
      <rect x="6" y="0" width="4.5" height="4.5" rx="0.5" />
      <rect x="0" y="6" width="4.5" height="4.5" rx="0.5" />
      <rect x="6" y="6" width="4.5" height="4.5" rx="0.5" />
    </g>

    <!-- Marble Tile Slabs -->
    <!-- Tile 1: White Carrara -->
    <polygon points="32,60 42,52 42,122 32,122" fill="url(#carraraTileD)" stroke="#CBD5E1" stroke-width="0.8" />
    
    <!-- Tile 2: Black Nero Marquina -->
    <polygon points="44,50 56,41 56,122 44,122" fill="url(#marquinaTileD)" stroke="#64748B" stroke-width="0.5" />

    <!-- Tile 3: Grey Granite -->
    <polygon points="58,39 70,30 70,122 58,122" fill="url(#graniteTileD)" />

    <!-- Stylized 'S' Monogram in Crisp White -->
    <path d="M 88,40 C 72,30 52,36 53,56 C 54,72 84,74 84,94 C 84,112 60,112 50,100" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />

    <!-- Opulent Golden Serif 'M' -->
    <g transform="translate(74, 46)">
      <path d="M 8,76 L 8,30 L 24,58 L 40,30 L 40,76" fill="none" stroke="url(#logoGoldD)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <polygon points="4,76 12,76 12,72 4,72" fill="url(#logoGoldD)" />
      <polygon points="36,76 44,76 44,72 36,72" fill="url(#logoGoldD)" />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY (Right) ================= -->
  <g transform="translate(175, 10)">
    <!-- 1. SHARANYA Wordmark (White on Dark) -->
    <text x="0" y="58" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="52" font-weight="700" letter-spacing="4.5" fill="#FFFFFF">
      SHARANYA
    </text>

    <!-- 2. MARBLES with Horizontal Accent Rules -->
    <g transform="translate(0, 92)">
      <!-- Left Tapered Rule -->
      <line x1="0" y1="-8" x2="65" y2="-8" stroke="url(#logoGoldD)" stroke-width="2" stroke-linecap="round" />
      
      <!-- MARBLES Wordmark -->
      <text x="80" y="0" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="28" font-weight="600" letter-spacing="14" fill="url(#logoGoldD)">
        MARBLES
      </text>

      <!-- Right Tapered Rule -->
      <line x1="390" y1="-8" x2="455" y2="-8" stroke="url(#logoGoldD)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 3. Primary Services Line -->
    <g transform="translate(0, 118)" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#E2E8F0">
      <text x="0" y="0">TILES FITTING</text>
      <text x="120" y="0" fill="url(#logoGoldD)" font-weight="400">|</text>
      <text x="135" y="0">MARBLE POLISHING</text>
      <text x="310" y="0" fill="url(#logoGoldD)" font-weight="400">|</text>
      <text x="325" y="0">GRANITE FITTING</text>
    </g>

    <!-- 4. Bottom Cleaning & Polish Services Line with rules -->
    <g transform="translate(0, 140)">
      <line x1="30" y1="-4" x2="85" y2="-4" stroke="url(#logoGoldD)" stroke-width="1" opacity="0.6" />
      <text x="98" y="0" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.5" fill="#DFB96C">
        CLEANING AND POLISH SERVICES
      </text>
      <line x1="370" y1="-4" x2="425" y2="-4" stroke="url(#logoGoldD)" stroke-width="1" opacity="0.6" />
    </g>
  </g>
</svg>
