    <line x1="191" y1="62" x2="365" y2="62" stroke="url(#goldLinearD)" stroke-width="1.2" opacity="0.8" />

    <text x="2" y="78" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.2" fill="#0B1B33">
