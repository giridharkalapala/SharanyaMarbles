<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Rich Logo Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB96C" />
      <stop offset="45%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#DFB96C" />
      <stop offset="100%" stop-color="#9A782F" />
    </linearGradient>
    
    <!-- Deep Obsidian Navy Gradient -->
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1320" />
      <stop offset="100%" stop-color="#060B12" />
    </linearGradient>

    <!-- Carrara White Marble Gradient -->
    <linearGradient id="carraraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <!-- Marquina Black Marble Gradient -->
    <linearGradient id="marquinaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1320" />
    </linearGradient>

    <!-- Granite Grey Gradient -->
    <linearGradient id="graniteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Glow / Frame -->
  <circle cx="50" cy="50" r="48" fill="url(#favNavy)" />
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#favGold)" stroke-width="1.8" />

  <!-- Outer Golden Crescent Arc (Signature Logo Element) -->
  <path d="M 50,8 A 42,42 0 1 0 88,68" fill="none" stroke="url(#favGold)" stroke-width="3.5" stroke-linecap="round" />

  <!-- House Roof & Window Grid -->
  <path d="M 44,22 L 68,10 L 92,22" fill="none" stroke="#0B1320" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <!-- 4-Pane Window -->
  <g transform="translate(64, 24)" fill="url(#favGold)">
    <rect x="0" y="0" width="3" height="3" rx="0.5" />
    <rect x="4" y="0" width="3" height="3" rx="0.5" />
    <rect x="0" y="4" width="3" height="3" rx="0.5" />
    <rect x="4" y="4" width="3" height="3" rx="0.5" />
  </g>

  <!-- Three Marble/Stone Tiles (Carrara, Marquina, Granite) -->
  <!-- Tile 1: Carrara White -->
  <polygon points="20,38 27,33 27,78 20,78" fill="url(#carraraGrad)" stroke="#CBD5E1" stroke-width="0.5" />
  <path d="M 22,46 Q 25,54 23,65" fill="none" stroke="#94A3B8" stroke-width="0.6" opacity="0.6" />
  
  <!-- Tile 2: Marquina Black -->
  <polygon points="28,31 36,25 36,78 28,78" fill="url(#marquinaGrad)" />
  <path d="M 30,42 L 34,58" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.7" />

  <!-- Tile 3: Granite Grey -->
  <polygon points="37,24 45,18 45,78 37,78" fill="url(#graniteGrad)" />

  <!-- Stylized 'S' Monogram in Navy / White Trim -->
  <path d="M 56,26 C 46,20 32,24 33,36 C 34,46 54,48 54,60 C 54,72 38,72 32,64" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <path d="M 56,26 C 46,20 32,24 33,36 C 34,46 54,48 54,60 C 54,72 38,72 32,64" fill="none" stroke="url(#favNavy)" stroke-width="3.2" stroke-linecap="round" />

  <!-- Elegant Golden Serif 'M' -->
  <g transform="translate(48, 30)">
    <!-- 'M' Stem Left -->
    <path d="M 6,48 L 6,18 L 16,36 L 26,18 L 26,48" fill="none" stroke="url(#favGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="4,48 8,48 8,46 4,46" fill="url(#favGold)" />
    <polygon points="24,48 28,48 28,46 24,46" fill="url(#favGold)" />
  </g>
</svg>
